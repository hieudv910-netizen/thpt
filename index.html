@media(max-width:1000px){#g{grid-template-columns:240px 1fr}#g aside.r{grid-column:1/-1}}

<script>

['Tin tức',[['Bản tin trường','#/tin-tuc/Bản tin trường'],['Bài viết','#/tin-tuc/Bài viết'],['Tuyển sinh - Tốt nghiệp THPT','#/tin-tuc/Tuyển sinh']]],
['Điều hành',[['Thông tin, thông báo'],['Lịch công tác tuần'],['Lịch công tác tháng'],['Thời khoá biểu','#/tkb'],['Văn phòng trực tuyến'],['Chính quyền điện tử']]],

const fd=d=>d.toLocaleDateString('vi-VN'),gr=h=>`background:linear-gradient(135deg,hsl(${h},60%,35%),hsl(${(h+50)%360},65%,55%))`;

const DB=Array.from({length:40},(_,i)=>({to:TO[i%9],pos:i<1?'Hiệu trưởng':i<3?'Phó hiệu trưởng':POS[2+i%7]}));
const SUBJ=['Toán','Ngữ văn','Tiếng Anh','Vật lí','Hóa học','Sinh học','Lịch sử','Địa lí','Tin học','GDCD'],DAYS=['Thứ 2','Thứ 3','Thứ 4','Thứ 5','Thứ 6'],CL=['10A1','10A2','11A1','11A2','12A1','12A2'];
const LI=(a)=>a.map(n=>`<li><a href="#/bai/${n.id}">${E(n.t)}</a> <span class="dt">(${fd(n.d)})</span></li>`).join('');

let sz=+localStorage.sz||16;function fs(d){sz=Math.min(22,Math.max(13,sz+d));localStorage.sz=sz;document.documentElement.style.setProperty('--fs',sz+'px')}fs(0);
function dk(){document.body.classList.toggle('dark');localStorage.dk=document.body.classList.contains('dark')?1:''}if(localStorage.dk)document.body.classList.add('dark');

/* ===== TRANG CHỦ ===== */
let si=0,st,paused=false;
function home(){const v=(+localStorage.vw||1305808)+Math.floor(Math.random()*3+1);localStorage.vw=v;
 const sl=Array.from({length:5},(_,i)=>`<div class="s ${i?'':'on'}" style="${gr(i*70)}">${['Chào mừng năm học mới','Học sinh giỏi tỏa sáng','Hoạt động ngoài giờ sôi nổi','Câu lạc bộ đa dạng','Thư viện thân thiện'][i]}</div>`).join('');
 const qk=[['💻','Văn phòng trực tuyến'],['📅','Lịch công tác tuần'],['🗓️','Lịch công tác tháng'],['📚','Tra cứu sách thư viện'],['🕒','Thời khóa biểu','#/tkb'],['🗂️','Tài nguyên điện tử'],['📄','Văn bản'],['🖼️','Thư viện ảnh','#/anh'],['🎓','Cựu giáo viên'],['🧑‍🎓','Cựu học sinh']].map(q=>`<a href="${q[2]||'#/cap-nhat'}"><span>${q[0]}</span>${q[1]}</a>`).join('');
 const blk=(c,n)=>`<section class="bx"><h2>${c}</h2><div class="in"><div class="nw">${NEWS.filter(x=>x.c==CATS[n]).slice(0,2).map(x=>`<div><div class="th" style="${gr(x.h)}"></div><b><a href="#/bai/${x.id}">${E(x.t)}</a></b><br><span class="dt">${fd(x.d)}</span><p>Thông tin chi tiết về hoạt động của ${E(SCHOOL.short)}...</p></div>`).join('')}</div><b>Đọc thêm:</b><ul>${LI(NEWS.filter(x=>x.c==CATS[n]).slice(2,6))}</ul><a href="#/tin-tuc/${CATS[n]}">Xem tất cả »</a></div></section>`;
 $('#main').innerHTML=`<div class="sl" id="sl" onmouseenter="paused=1" onmouseleave="paused=0" role="region" aria-label="Ảnh nổi bật">${sl}<button class="pv" onclick="go(-1)" aria-label="Slide trước">‹</button><button class="nx" onclick="go(1)" aria-label="Slide sau">›</button><div class="dots">${[0,1,2,3,4].map(i=>`<i class="${i?'':'on'}"></i>`).join('')}</div></div><div class="qk">${qk}</div>
<div id="g"><aside class="l"><section class="bx"><h3>Giới thiệu về trường</h3><div class="in"><div class="th" style="${gr(210)}"></div><p>${E(SCHOOL.name)} là cơ sở giáo dục công lập, luôn đặt mục tiêu nâng cao chất lượng dạy và học, xây dựng môi trường thân thiện, kỷ cương.</p><a href="#/gioi-thieu">Đọc thêm »</a></div></section>

<section class="bx"><h3>Thống kê</h3><div class="in">Thành viên: <b>3</b><br>Nội dung: <b>${617+NEWS.length}</b><br>Liên kết web: <b>15</b><br>Lượt xem: <b>${v.toLocaleString('vi-VN')}</b></div></section></aside>

function lb(h){$('#lbi').style.cssText=gr(h);$('#lbi').textContent='Ảnh hoạt động của '+SCHOOL.short;$('#lb').style.display='flex'}
/* ===== TRANG CON ===== */
let pg=1;
function list(cat,q){const all=NEWS.filter(n=>(cat=='*'||n.c==cat)&&(!q||n.t.toLowerCase().includes(q.toLowerCase()))),pc=Math.max(1,Math.ceil(all.length/6));pg=Math.min(pg,pc);
 $('#main').innerHTML=`<section class="bx" style="margin-top:14px"><h2>Tin tức: ${E(cat=='*'?'Tất cả':cat)}</h2><div class="in"><p>${CATS.map(c=>`<a class="btn" href="#/tin-tuc/${c}">${c}</a>`).join('')}<a class="btn" href="#/tin-tuc/*">Tất cả</a></p>${all.slice((pg-1)*6,pg*6).map(n=>`<div style="display:flex;gap:12px;margin:10px 0"><div class="th" style="width:130px;height:80px;flex:none;${gr(n.h)}"></div><div><b><a href="#/bai/${n.id}">${E(n.t)}</a></b><br><span class="dt">${fd(n.d)} · ${E(n.c)}</span></div></div>`).join('')||'<p>Không tìm thấy bài viết.</p>'}<div class="pg">${Array.from({length:pc},(_,i)=>`<button class="${i+1==pg?'on':''}" onclick="pg=${i+1};route()">${i+1}</button>`).join('')}</div></div></section>`}
function art(id){const n=NEWS[id];if(!n)return nf();$('#main').innerHTML=`<article class="bx" style="margin-top:14px"><h2>${E(n.t)}</h2><div class="in"><p class="dt">${fd(n.d)} · ${E(n.c)} · Tác giả: ${E(n.by)}</p><div class="th" style="height:220px;${gr(n.h)}"></div><p>${E(SCHOOL.name)} tổ chức hoạt động "${E(n.t)}" với sự tham gia của giáo viên, học sinh và phụ huynh. Hoạt động diễn ra trang trọng, thiết thực, góp phần nâng cao chất lượng giáo dục toàn diện của nhà trường.</p><p>Nhà trường tiếp tục triển khai các nội dung liên quan theo kế hoạch năm học.</p><button class="btn" onclick="print()">🖨 In</button><button class="btn" onclick="navigator.clipboard&&navigator.clipboard.writeText(location.href);toast('Đã sao chép liên kết')">🔗 Chia sẻ</button><h3 style="margin-top:14px">Bài liên quan</h3><ul>${LI(NEWS.filter(x=>x.c==n.c&&x.id!=id).slice(0,4))}</ul></div></article>`}
function nf(){$('#main').innerHTML='<section class="bx" style="margin-top:14px"><h2>Thông báo</h2><div class="in"><p>Nội dung đang cập nhật.</p><a href="#/">← Về trang chủ</a></div></section>'}
function about(){$('#main').innerHTML=`<section class="bx" style="margin-top:14px"><h2>Giới thiệu về trường</h2><div class="in"><div class="th" style="height:200px;${gr(210)}"></div><p>${E(SCHOOL.name)} là trường trung học phổ thông công lập. Trải qua nhiều năm xây dựng và phát triển, nhà trường luôn duy trì nền nếp, kỷ cương, quan tâm chất lượng đại trà và mũi nhọn, chăm lo hoạt động Đoàn, câu lạc bộ và hướng nghiệp cho học sinh.</p><p>Liên hệ: ${SCHOOL.phone} · ${SCHOOL.email}</p></div></section>`}
function contact(){$('#main').innerHTML=`<section class="bx" style="margin-top:14px"><h2>Liên hệ</h2><div class="in"><p><b>${E(SCHOOL.name)}</b><br>${E(SCHOOL.addr)}<br>☎ ${SCHOOL.phone}<br>✉ ${SCHOOL.email}</p><form id="cf" novalidate><p><input id="cn" placeholder="Họ và tên" aria-label="Họ và tên" style="width:100%"></p><p><input id="ce" type="email" placeholder="Email" aria-label="Email" style="width:100%"></p><p><textarea id="cm" rows="5" placeholder="Nội dung" aria-label="Nội dung"></textarea></p><p id="cer" style="color:var(--ac)" role="alert"></p><button class="btn p">Gửi liên hệ</button></form></div></section>`;
 $('#cf').onsubmit=e=>{e.preventDefault();const n=$('#cn').value.trim(),m=$('#ce').value.trim(),c=$('#cm').value.trim();if(n.length<2)return $('#cer').textContent='Vui lòng nhập họ tên.';if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(m))return $('#cer').textContent='Email chưa hợp lệ.';if(c.length<5)return $('#cer').textContent='Vui lòng nhập nội dung.';
  const a=JSON.parse(localStorage.ct||'[]');a.push({n,m,c,t:Date.now()});localStorage.ct=JSON.stringify(a);e.target.reset();$('#cer').textContent='';toast('Đã gửi liên hệ. Cảm ơn bạn!')}}
function tkb(cl='10A1'){const rows=Array.from({length:10},(_,p)=>`<tr><th>Tiết ${p+1}</th>${DAYS.map((_,d)=>`<td>${p==4||p==9?'<span class="dt">Nghỉ</span>':SUBJ[(p+d*3+CL.indexOf(cl))%10]+'<br><span class="dt">'+E(SCHOOL.person)+'</span>'}</td>`).join('')}</tr>`).join('');
 $('#main').innerHTML=`<section class="bx" style="margin-top:14px"><h2>Thời khóa biểu</h2><div class="in"><label>Lớp: <select id="cs" onchange="tkb(this.value)">${CL.map(c=>`<option ${c==cl?'selected':''}>${c}</option>`).join('')}</select></label><div class="tw"><table><tr><th></th>${DAYS.map(d=>`<th>${d}</th>`).join('')}</tr>${rows}</table></div></div></section>`}
function pics(){$('#main').innerHTML=`<section class="bx" style="margin-top:14px"><h2>Thư viện ảnh</h2><div class="in gal">${Array.from({length:12},(_,i)=>`<button style="${gr(i*30)}" onclick="lb(${i*30})" aria-label="Xem ảnh ${i+1}"></button>`).join('')}</div></section>`}
function dir(){$('#main').innerHTML=`<section class="bx" style="margin-top:14px"><h2>Danh bạ điện thoại</h2><div class="in"><p><select id="fg" aria-label="Lọc theo tổ"><option value="">Tất cả các tổ</option>${['Ban giám hiệu',...TO].map(t=>`<option>${t}</option>`).join('')}</select> <input id="fp2" placeholder="Lọc theo chức vụ" aria-label="Lọc theo chức vụ"></p><div id="dl"></div></div></section>`;
 const draw=()=>{const g=$('#fg').value,p=$('#fp2').value.toLowerCase(),gs=['Ban giám hiệu',...TO].filter(x=>!g||x==g);$('#dl').innerHTML=gs.map(x=>`<details data-g="${E(x)}"><summary>${E(x)}</summary><div class="tw"></div></details>`).join('');
  document.querySelectorAll('#dl details').forEach(d=>d.addEventListener('toggle',()=>{if(!d.open||d.dataset.done)return;d.dataset.done=1;const gn=d.dataset.g,rs=(gn=='Ban giám hiệu'?DB.filter(r=>/trưởng/.test(r.pos)&&/Hiệu|Phó/.test(r.pos)):DB.filter(r=>r.to==gn&&!/Hiệu/.test(r.pos))).filter(r=>!p||r.pos.toLowerCase().includes(p));
   d.lastElementChild.innerHTML='<table><tr><th>STT</th><th>Họ và tên</th><th>Chức vụ</th><th>SĐT</th><th>Email</th></tr>'+(rs.length?rs:[{pos:'Giáo viên'},{pos:'Tổ trưởng'}]).map((r,i)=>`<tr><td>${i+1}</td><td>${E(SCHOOL.person)}</td><td>${E(r.pos)}</td><td>${SCHOOL.phone}</td><td>${SCHOOL.email}</td></tr>`).join('')+'</table>'}))};
 $('#fg').onchange=draw;$('#fp2').oninput=draw;draw()}
function route(){const h=decodeURIComponent(location.hash||'#/').slice(2),[p,a]=h.split('/'),qs=h.split('?q=')[1];clearInterval(st);
 if(!p)home();else if(p=='tin-tuc')list((a||'*').split('?')[0],qs);else if(p=='bai')art(+a);else if(p=='gioi-thieu')about();else if(p=='lien-he')contact();else if(p=='tkb')tkb();else if(p=='anh')pics();else if(p=='danh-ba')dir();else nf();
 document.getElementById('mn').classList.remove('open')}
addEventListener('hashchange',()=>{pg=1;route();scrollTo(0,0)});route();
</script></body></html>
